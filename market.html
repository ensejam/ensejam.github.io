<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بازارچه انسجام من</title>

    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    
    <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/YekanBakh/YekanBakh.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #041a17;
            --teal: #00bfa5;
            --teal-dark: #00796b;
            --gold: #e5c158;
            --orange: #ff7043;
            --text-main: #ffffff;
            --text-muted: #8fa6a3;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-bg: #082622;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Yekan Bakh', 'Vazirmatn', sans-serif; }

        body {
            background-color: #000;
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden; 
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background-color: var(--bg-dark);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        .header {
            padding: 16px 20px;
            background: var(--bg-dark);
            z-index: 10;
            position: sticky;
            top: 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-btn:active { background: rgba(255,255,255,0.1); }

        .header-title { font-size: 18px; font-weight: 700; }

        .cart-icon {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 18px;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--orange);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
            opacity: 0;
            transform: scale(0);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cart-badge.show { opacity: 1; transform: scale(1); }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px 14px;
            gap: 10px;
        }
        .search-bar input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 14px;
            font-family: inherit;
        }
        .search-bar input::placeholder { color: var(--text-muted); }

        .scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 80px;
            scrollbar-width: none;
        }
        .scroll-area::-webkit-scrollbar { display: none; }

        .categories {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }

        .cat-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-btn.active {
            background: var(--teal);
            color: #fff;
            border-color: var(--teal);
            box-shadow: 0 4px 15px rgba(0, 191, 165, 0.4);
        }

        .banner {
            margin: 0 20px 20px;
            border-radius: 20px;
            padding: 24px;
            background: linear-gradient(135deg, rgba(0, 191, 165, 0.2), rgba(229, 193, 88, 0.1));
            border: 1px solid var(--teal-dark);
            position: relative;
            overflow: hidden;
        }
        .banner h2 { font-size: 20px; margin-bottom: 8px; color: var(--gold); }
        .banner p { font-size: 13px; color: var(--text-muted); }

        .section-title { padding: 0 20px; margin-bottom: 16px; font-size: 16px; }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 0 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
            cursor: pointer;
        }
        .product-card:active { transform: scale(0.96); }

        .product-img {
            height: 120px;
            background: linear-gradient(45deg, #0d3832, #15463e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
        }
        .product-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--orange);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 10px;
        }

        .product-info { padding: 12px; }
        .product-name { font-size: 13px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
        .product-price { font-size: 14px; color: var(--teal); font-weight: 800; }
        .product-price span { font-size: 10px; color: var(--text-muted); font-weight: 400; }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(4, 26, 23, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 20;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            gap: 4px;
            text-decoration: none;
        }
        .nav-item.active { color: var(--teal); }
        .nav-item svg { width: 22px; height: 22px; }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 30px 30px 0 0;
            padding: 24px;
            z-index: 51;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 1px solid var(--glass-border);
        }
        .bottom-sheet.active { transform: translateY(0); }

        .drag-handle {
            width: 40px;
            height: 4px;
            background: var(--glass-border);
            border-radius: 4px;
            margin: 0 auto 20px;
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 191, 165, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 16px;
        }

        .modal-title { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 8px; }
        .modal-desc { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px; line-height: 1.6; }
        
        .modal-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--glass);
            border-radius: 16px;
        }
        .modal-price-label { font-size: 13px; color: var(--text-muted); }
        .modal-price-val { font-size: 18px; font-weight: 800; color: var(--teal); }

        .btn-add-cart {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, var(--teal), var(--teal-dark));
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 191, 165, 0.3);
        }
        .btn-add-cart:active { transform: scale(0.96); }

    </style>
</head>
<body>

    <div id="app-container">
        <div class="header">
            <div class="header-top">
                <a href="index.html" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
                </a>
                <div class="header-title">بازارچه انسجام</div>
                <div class="cart-icon" id="cartBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span class="cart-badge" id="cartBadge">0</span>
                </div>
            </div>
            <div class="search-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="جستجوی محصول...">
            </div>
        </div>

        <div class="scroll-area">
            <div class="categories" id="categoriesContainer">
                <div class="cat-btn active" data-cat="all">همه محصولات</div>
                <div class="cat-btn" data-cat="food">خوراکی</div>
                <div class="cat-btn" data-cat="handicraft">صنایع دستی</div>
                <div class="cat-btn" data-cat="clothing">پوشاک</div>
                <div class="cat-btn" data-cat="digital">دیجیتال</div>
            </div>

            <div class="banner">
                <h2>پیشنهاد ویژه</h2>
                <p>تخفیف‌های استثنایی روی محصولات محلی و صنایع دستی</p>
            </div>

            <h3 class="section-title">محصولات</h3>
            <!-- محصولات از اینجا به بعد توسط JS پر می‌شوند -->
            <div class="product-grid" id="productGrid"></div>
        </div>

        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>خانه</span>
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>دسته‌ها</span>
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>پروفایل</span>
            </a>
        </div>

        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="bottom-sheet" id="bottomSheet">
            <div class="drag-handle"></div>
            <div class="modal-icon" id="modalIcon">📦</div>
            <h2 class="modal-title" id="modalTitle">نام محصول</h2>
            <p class="modal-desc" id="modalDesc">توضیحات محصول...</p>
            
            <div class="modal-price-row">
                <span class="modal-price-label">قیمت محصول:</span>
                <span class="modal-price-val" id="modalPrice">۰ تومان</span>
            </div>

            <button class="btn-add-cart" id="addToCartBtn">افزودن به سبد خرید</button>
        </div>
    </div>

    <script>
        // --- ۱. متغیرها ---
        let products = []; // آرایه خالی که از فایل JSON پر می‌شود
        let cartCount = 0;
        let currentCategory = 'all';
        let searchQuery = '';

        const productGrid = document.getElementById('productGrid');

        // --- ۲. دریافت اطلاعات از فایل products.json ---
        async function fetchProducts() {
            try {
                const response = await fetch('products.json');
                if (!response.ok) throw new Error('خطا در بارگذاری فایل');
                products = await response.json();
                renderProducts(); // وقتی اطلاعات آمد، صفحه را رندر کن
            } catch (error) {
                console.error(error);
                productGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #ff5252;">خطا در بارگذاری محصولات. لطفاً صفحه را رفرش کنید.</div>`;
            }
        }

        // --- ۳. نمایش محصولات ---
        function renderProducts() {
            let filtered = products;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.cat === currentCategory);
            }
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
            }

            if (filtered.length === 0) {
                productGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">محصولی یافت نشد.</div>`;
                return;
            }

            productGrid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openModal(${p.id})">
                    <div class="product-img">
                        ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
                        <span>${p.icon || '📦'}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price.toLocaleString('fa-IR')} <span>تومان</span></div>
                    </div>
                </div>
            `).join('');
        }

        // --- ۴. رویدادها (جستجو و دسته‌بندی) ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderProducts();
        });

        document.getElementById('categoriesContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.cat;
            renderProducts();
        });

        // --- ۵. پنجره جزئیات محصول ---
        const overlay = document.getElementById('modalOverlay');
        const bottomSheet = document.getElementById('bottomSheet');

        window.openModal = function(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('modalIcon').innerText = product.icon || '📦';
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalDesc').innerText = product.desc || 'بدون توضیحات';
            document.getElementById('modalPrice').innerText = product.price.toLocaleString('fa-IR') + ' تومان';

            overlay.classList.add('active');
            bottomSheet.classList.add('active');
        }

        function closeModal() {
            overlay.classList.remove('active');
            bottomSheet.classList.remove('active');
        }
        overlay.addEventListener('click', closeModal);

        // --- ۶. سبد خرید ---
        const cartBadge = document.getElementById('cartBadge');
        document.getElementById('addToCartBtn').addEventListener('click', () => {
            cartCount++;
            cartBadge.innerText = cartCount;
            cartBadge.classList.add('show');
            
            const btn = document.getElementById('addToCartBtn');
            btn.innerText = '✓ به سبد اضافه شد';
            btn.style.background = 'var(--gold)';
            
            setTimeout(() => {
                closeModal();
                setTimeout(() => {
                    btn.innerText = 'افزودن به سبد خرید';
                    btn.style.background = '';
                }, 300);
            }, 800);
        });

        // --- ۷. شروع به کار ---
        (function init() {
            if (window.Eitaa && window.Eitaa.WebApp) {
                window.Eitaa.WebApp.ready();
                if (!window.Eitaa.WebApp.isExpanded) window.Eitaa.WebApp.expand();
            }
            fetchProducts(); // این تابع جایگزین کدهای ثابت قبلی شده است
        })();
    </script>
</body>
</html>
