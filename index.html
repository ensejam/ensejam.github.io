<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>انسجام من | بازارچه و کانال</title>

    <!-- ۱. اتصال به کیت توسعه ایتا (الزامی برای برنامک) -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <style>
        /* ۲. استفاده از متغیرهای تم ایتا برای هماهنگی خودکار با حالت تاریک/روشن */
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #1a1a1a);
            --hint: var(--tg-theme-hint-color, #707579);
            --button: var(--tg-theme-button-color, #2e7d32); /* رنگ سبز به عنوان رنگ اصلی برند */
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --viewport-height: var(--tg-viewport-stable-height, 100vh);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif; /* فونت فارسی */
            background-color: var(--bg);
            color: var(--text);
            height: var(--viewport-height);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden; /* جلوگیری از اسکرول ناخواسته در صفحه اول */
        }

        /* --- بخش بالا: برند و معرفی --- */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 8vh; /* فاصله از بالا برای تنفس بصری */
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(46, 125, 50, 0.25);
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .brand-tagline {
            font-size: 16px;
            color: var(--hint);
            line-height: 1.7;
            max-width: 320px;
            margin: 0 auto 32px;
        }

        .intro-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: right;
            margin-bottom: 24px;
        }

        .intro-card h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        .intro-card p {
            font-size: 14px;
            line-height: 1.8;
            color: var(--hint);
        }

        /* --- بخش پایین: دکمه اصلی ورود به بازارچه --- */
        .action-section {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            background-color: var(--button);
            color: var(--button-text);
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-decoration: none;
        }

        .btn-primary:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--hint);
            border: 1.5px solid var(--card-bg);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-secondary:active {
            background: var(--card-bg);
        }

        /* آیکون‌های ساده با CSS (بدون نیاز به فایل خارجی) */
        .icon-arrow {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-top: 2.5px solid currentColor;
            border-right: 2.5px solid currentColor;
            transform: rotate(45deg);
        }

        /* حالت تاریک دستی (در صورت نیاز) */
        @media (prefers-color-scheme: dark) {
            :root {
                --button: #4caf50;
            }
        }
    </style>
</head>
<body>

    <!-- بخش معرفی -->
    <div class="brand-section">
        <div class="logo-placeholder">ان</div>
        <h1 class="brand-title">انسجام من</h1>
        <p class="brand-tagline">اکوسیستمی برای توانمندسازی اقتصادی و اطلاع‌رسانی محلی</p>

        <div class="intro-card">
            <h2>یک برنامک، دو کارکرد</h2>
            <p>
                از یک طرف، ویترین بازارچه اقتصادی ما برای معرفی و دسترسی به محصولات و خدمات محلی است.
                از طرف دیگر، پلی است به کانال «انسجام من» برای اطلاع از آخرین اخبار، فرصت‌ها و رویدادها.
            </p>
        </div>
    </div>

    <!-- بخش اقدام (CTA) -->
    <div class="action-section">
        <!-- دکمه اصلی: ورود به بازارچه -->
        <button class="btn-primary" id="enterMarketBtn">
            ورود به بازارچه
            <span class="icon-arrow"></span>
        </button>

        <!-- دکمه ثانویه: دسترسی به کانال (اختیاری) -->
        <a href="https://eitaa.com/enshejam_man" target="_blank" class="btn-secondary" id="channelLink">
            مشاهده کانال «انسجام من»
        </a>
    </div>

    <script>
        // --- ۳. مقداردهی اولیه برنامک در محیط ایتا ---
        (function initEitaaApp() {
            // بررسی می‌کنیم که آیا در محیط ایتا هستیم یا خیر
            if (window.Eitaa && window.Eitaa.WebApp) {
                const WebApp = window.Eitaa.WebApp;

                // به ایتا اطلاع می‌دهیم که برنامک آماده نمایش است (لایه لودینگ برداشته می‌شود)
                WebApp.ready();

                // برنامک را تا تمام ارتفاع ممکن گسترش می‌دهیم تا فضای بیشتری داشته باشیم
                if (!WebApp.isExpanded) {
                    WebApp.expand();
                }

                // (اختیاری) اگر نام کاربر را داریم، می‌توانیم در آینده شخصی‌سازی کنیم.
                // const user = WebApp.initDataUnsafe?.user;
                // if (user && user.first_name) {
                //     console.log('کاربر:', user.first_name);
                // }
            }
        })();

        // --- ۴. مدیریت کلیک روی دکمه ورود به بازارچه ---
        document.getElementById('enterMarketBtn').addEventListener('click', function() {
            // ⚠️ اینجا آدرس صفحه بازارچه خود را قرار بده.
            // این می‌تواند یک صفحه دیگر در همان پروژه گیت‌هاب باشد (مثلاً market.html)
            // یا یک آدرس کامل از یک سرویس دیگر.
            const marketUrl = 'market.html'; // <-- این خط را با آدرس واقعی بازارچه جایگزین کن

            // هدایت کاربر به صفحه بازارچه
            window.location.href = marketUrl;

            // اگر ترجیح می‌دهی بازارچه در یک تب جدید باز شود (نه توصیه‌شده در WebView):
            // window.open(marketUrl, '_blank');
        });
    </script>
</body>
</html>
