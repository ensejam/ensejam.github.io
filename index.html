<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>انسجام من | بازارچه و کانال</title>

    <!-- کیت توسعه ایتا -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <!-- فونت لوکس یکان بخ -->
    <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/YekanBakh/YekanBakh.css">
    
    <!-- فونت جایگزین (در صورتی که CDN یکان بالا نیامد) -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* پالت رنگ گرم و لوکس */
            --bg-warm: #faf7f2; /* کرم گرم */
            --teal-deep: #005c53; /* فیروزه‌ای تیره (از لوگو) */
            --teal-light: #00897b; 
            --gold: #d4af37; /* طلایی */
            --gold-light: #f3c64c;
            --orange-warm: #e66a35;
            --text-main: #2c2c2c;
            --text-muted: #7a7a7a;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(212, 175, 55, 0.2); /* حاشیه طلایی محو */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Yekan Bakh', 'Vazirmatn', sans-serif;
            background-color: var(--bg-warm);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            position: relative;
        }

        /* --- نورپردازی پس‌زمینه (گرم و غروب) --- */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.6;
        }
        .glow-warm { top: -10%; right: -10%; width: 70vw; height: 70vw; background: #ffd5a1; }
        .glow-teal { bottom: 0%; left: -20%; width: 60vw; height: 60vw; background: #a7ffeb; opacity: 0.4; }

        /* --- بخش هدر --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 5vh;
            animation: slideDown 0.8s ease-out;
        }

        /* لوگوی شبیه‌سازی شده بر اساس تصویر شما */
        .logo-container {
            width: 110px;
            height: 110px;
            border-radius: 35px;
            background: var(--teal-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
            box-shadow: 0 15px 35px -5px rgba(0, 92, 83, 0.4);
            border: 2px solid var(--gold);
        }

        /* افکت درخشش لوگو */
        .logo-container::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 45px;
            background: var(--gold);
            filter: blur(20px);
            opacity: 0.3;
            z-index: -1;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 5px;
        }

        .title {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--teal-deep), var(--orange-warm));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            max-width: 280px;
            line-height: 1.8;
            font-weight: 400;
        }

        /* --- کارت‌های ویژگی --- */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 40px;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        .feature-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 22px 16px;
            text-align: right;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* خط طلایی بالای کارت */
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.5;
        }

        .feature-icon {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: rgba(0, 92, 83, 0.08);
            color: var(--teal-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 14px;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--teal-deep);
        }

        .feature-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* --- بخش دکمه‌ها --- */
        .actions {
            margin-top: auto;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        /* دکمه اصلی (فیروزه‌ای با حاشیه طلایی) */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--teal-deep), #00796b);
            color: #fff;
            border: 1px solid var(--gold);
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 12px 25px -8px rgba(0, 92, 83, 0.5);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 5px 15px -5px rgba(0, 92, 83, 0.5);
        }
        
        .btn-primary:active::after { left: 150%; }

        /* دکمه ثانویه (شیشه‌ای) */
        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: var(--teal-deep);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-secondary:active { background: #fff; }

        /* انیمیشن‌ها */
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- نورهای گرم پس‌زمینه -->
    <div class="bg-glow glow-warm"></div>
    <div class="bg-glow glow-teal"></div>

    <!-- هدر -->
    <div class="header">
        <div class="logo-container">
            <div class="logo-text">ان</div>
        </div>
        <h1 class="title">انسجام من</h1>
        <p class="subtitle">اکوسیستمی گرم و صمیمی برای توانمندسازی اقتصادی و اطلاع‌رسانی محلی</p>
    </div>

    <!-- کارت‌ها -->
    <div class="features">
        <div class="feature-card">
            <div class="feature-icon">🛒</div>
            <div class="feature-title">بازارچه محلی</div>
            <div class="feature-desc">معرفی و دسترسی به محصولات و خدمات بومی</div>
        </div>
        <div class="feature-card">
            <div class="feature-icon">📢</div>
            <div class="feature-title">اخبار و رویدادها</div>
            <div class="feature-desc">اطلاع از آخرین فرصت‌ها در کانال انسجام</div>
        </div>
    </div>

    <!-- دکمه‌ها -->
    <div class="actions">
        <button class="btn-primary" id="enterMarketBtn">
            ورود به بازارچه
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>

        <a href="https://eitaa.com/enshejam_man" target="_blank" class="btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            مشاهده کانال
        </a>
    </div>

    <script>
        (function initEitaaApp() {
            if (window.Eitaa && window.Eitaa.WebApp) {
                const WebApp = window.Eitaa.WebApp;
                WebApp.ready();
                if (!WebApp.isExpanded) WebApp.expand();
            }
        })();

        document.getElementById('enterMarketBtn').addEventListener('click', function() {
            window.location.href = 'market.html';
        });
    </script>
</body>
</html>
