<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>انسجام من | بازارچه و کانال</title>

    <!-- اتصال به کیت توسعه ایتا -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <!-- فونت فارسی وزیرمتن (اختیاری اما زیبا) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- متغیرهای تم (هماهنگ با ایتا) --- */
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #1a1a1a);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --button: var(--tg-theme-button-color, #2e7d32);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f8f9fa);
            --divider: var(--tg-theme-hint-color, #e5e5ea);
            --viewport-height: var(--tg-viewport-stable-height, 100vh);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: var(--viewport-height);
            display: flex;
            flex-direction: column;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
            position: relative;
        }

        /* --- پس‌زمینه تزئینی (گرادیان نرم) --- */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            right: -20%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(46, 125, 50, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255, 152, 0, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- محتوای اصلی --- */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        /* --- بخش بالا: برند --- */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 6vh;
        }

        /* لوگو با افکت شیشه‌ای */
        .logo-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .logo {
            width: 88px;
            height: 88px;
            border-radius: 26px;
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 34px;
            font-weight: 800;
            box-shadow:
                0 10px 30px rgba(46, 125, 50, 0.25),
                inset 0 2px 4px rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 2;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* حلقه تزئینی دور لوگو */
        .logo-ring {
            position: absolute;
            inset: -8px;
            border-radius: 32px;
            border: 2px dashed rgba(46, 125, 50, 0.2);
            z-index: 1;
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .brand-title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tagline {
            font-size: 15px;
            color: var(--hint);
            line-height: 1.7;
            max-width: 300px;
            margin: 0 auto 28px;
        }

        /* کارت معرفی با افکت شیشه‌ای */
        .intro-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 22px;
            width: 100%;
            max-width: 400px;
            text-align: right;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
        }

        /* حالت تاریک برای کارت شیشه‌ای */
        @media (prefers-color-scheme: dark) {
            .intro-card {
                background: rgba(40, 40, 40, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
        }

        .intro-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .intro-card-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
        }

        .intro-card h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .intro-card p {
            font-size: 13.5px;
            line-height: 1.9;
            color: var(--hint);
        }

        /* --- بخش پایین: دکمه‌ها --- */
        .action-section {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 24px;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: #ffffff;
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(46, 125, 50, 0.3);
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        }

        .btn-primary:active::after {
            left: 100%;
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px;
            background: transparent;
            color: var(--hint);
            border: 1.5px solid var(--divider);
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-secondary:active {
            background: var(--card-bg);
            border-color: var(--button);
        }

        /* آیکون فلش */
        .icon-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            transition: transform 0.2s;
        }

        .btn-primary:active .icon-arrow {
            transform: translateX(-4px);
        }

        /* آیکون کانال */
        .icon-channel {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="content">
        <!-- بخش معرفی -->
        <div class="brand-section">
            <div class="logo-wrapper">
                <div class="logo-ring"></div>
                <div class="logo">ان</div>
            </div>
            <h1 class="brand-title">انسجام من</h1>
            <p class="brand-tagline">اکوسیستمی برای توانمندسازی اقتصادی و اطلاع‌رسانی محلی</p>

            <div class="intro-card">
                <div class="intro-card-header">
                    <div class="intro-card-icon">✨</div>
                    <h2>یک برنامک، دو کارکرد</h2>
                </div>
                <p>
                    از یک طرف، ویترین بازارچه اقتصادی ما برای معرفی و دسترسی به محصولات و خدمات محلی است.
                    از طرف دیگر، پلی است به کانال «انسجام من» برای اطلاع از آخرین اخبار، فرصت‌ها و رویدادها.
                </p>
            </div>
        </div>

        <!-- بخش اقدام (CTA) -->
        <div class="action-section">
            <button class="btn-primary" id="enterMarketBtn">
                ورود به بازارچه
                <span class="icon-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </span>
            </button>

            <a href="https://eitaa.com/enshejam_man" target="_blank" class="btn-secondary" id="channelLink">
                <span class="icon-channel">📢</span>
                مشاهده کانال «انسجام من»
            </a>
        </div>
    </div>

    <script>
        // --- مقداردهی اولیه برنامک در محیط ایتا ---
        (function initEitaaApp() {
            if (window.Eitaa && window.Eitaa.WebApp) {
                const WebApp = window.Eitaa.WebApp;

                // آماده‌سازی برنامک
                WebApp.ready();

                // گسترش تا تمام ارتفاع
                if (!WebApp.isExpanded) {
                    WebApp.expand();
                }

                // تنظیم رنگ هدر ایتا (اختیاری)
                if (WebApp.setHeaderColor) {
                    try {
                        WebApp.setHeaderColor('#2e7d32');
                    } catch (e) {
                        // در برخی نسخه‌ها ممکن است پشتیبانی نشود
                    }
                }
            }
        })();

        // --- مدیریت کلیک روی دکمه ورود به بازارچه ---
        document.getElementById('enterMarketBtn').addEventListener('click', function() {
            // آدرس صفحه بازارچه
            const marketUrl = 'market.html';

            // هدایت کاربر به صفحه بازارچه
            window.location.href = marketUrl;
        });
    </script>
</body>
</html>
