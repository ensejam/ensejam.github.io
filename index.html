<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>انسجام من | بازارچه و کانال</title>

    <!-- کیت توسعه ایتا -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <!-- فونت لوکس یکان بخ -->
    <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/YekanBakh/YekanBakh.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a1917;
            --teal: #00897b;
            --teal-deep: #005c53;
            --gold: #d4af37;
            --gold-light: #ffd700;
            --orange: #e66a35;
            --text-light: #ffffff;
            --text-muted: #b3c6c4;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Yekan Bakh', 'Vazirmatn', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            position: relative;
        }

        /* --- پس‌زمینه عکس شما با افکت پارالاکس و بلور --- */
        .bg-image {
            position: fixed;
            inset: -20px;
            background: url('hero-bg.jpg') no-repeat center center/cover;
            filter: blur(8px) brightness(0.4);
            z-index: -3;
            animation: bgPan 20s infinite alternate linear;
        }

        /* لایه رنگی روی عکس برای لوکس شدن */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 92, 83, 0.4) 0%, rgba(10, 25, 23, 0.9) 100%);
            z-index: -2;
        }

        /* --- بوم (Canvas) برای ذرات متحرک جاوااسکریپت --- */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none; /* تا مانع کلیک نشود */
        }

        @keyframes bgPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-10px, -10px); }
        }

        /* --- هدر و لوگو با افکت سه بعدی --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 6vh;
            perspective: 1000px; /* برای افکت سه بعدی */
        }

        /* کانتینر لوگو برای افکت 3D */
        .logo-container {
            width: 110px;
            height: 110px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(0, 92, 83, 0.8), rgba(0, 137, 123, 0.8));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border: 2px solid var(--gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(212, 175, 55, 0.2);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out; /* حرکت نرم */
            position: relative;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: translateZ(30px); /* بیرون آمدن متن از لوگو در حالت 3D */
        }

        .title {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--gold-light), var(--orange), var(--gold-light));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* متن تایپ شونده */
        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            max-width: 280px;
            line-height: 1.8;
            min-height: 50px; /* جلوگیری از پرش صفحه */
            font-weight: 400;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: var(--gold);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-right: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* --- کارت‌های شیشه‌ای با افکت 3D --- */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 40px;
            perspective: 1000px;
        }

        .feature-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 22px 16px;
            text-align: right;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, background 0.3s;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            transition: left 0.5s;
        }

        .feature-card:hover::before {
            left: 100%;
        }

        .feature-icon {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 14px;
            transform: translateZ(20px); /* افکت 3D */
        }

        .feature-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
            transform: translateZ(15px);
        }

        .feature-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.6;
            transform: translateZ(10px);
        }

        /* --- دکمه‌ها --- */
        .actions {
            margin-top: auto;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* دکمه مغناطیسی */
        .btn-wrapper {
            position: relative;
            width: 100%;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--teal-deep), var(--teal));
            color: #fff;
            border: 1px solid var(--gold);
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 15px 30px -10px rgba(0, 92, 83, 0.8);
            transition: transform 0.1s ease-out, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn-secondary:active { background: rgba(255,255,255,0.15); }

    </style>
</head>
<body>

    <!-- عکس شما به عنوان پس‌زمینه -->
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    
    <!-- بوم برای ذرات متحرک JS -->
    <canvas id="particleCanvas"></canvas>

    <!-- هدر -->
    <div class="header">
        <div class="logo-container" id="3dLogo">
            <div class="logo-text">ان</div>
        </div>
        <h1 class="title">انسجام من</h1>
        <!-- متن تایپ شونده -->
        <p class="subtitle" id="typewriter"></p>
    </div>

    <!-- کارت‌ها -->
    <div class="features">
        <div class="feature-card 3d-card">
            <div class="feature-icon">🛒</div>
            <div class="feature-title">بازارچه محلی</div>
            <div class="feature-desc">معرفی و دسترسی به محصولات بومی</div>
        </div>
        <div class="feature-card 3d-card">
            <div class="feature-icon">📢</div>
            <div class="feature-title">اخبار و رویدادها</div>
            <div class="feature-desc">اطلاع از آخرین فرصت‌ها در کانال</div>
        </div>
    </div>

    <!-- دکمه‌ها -->
    <div class="actions">
        <div class="btn-wrapper">
            <button class="btn-primary" id="magneticBtn">
                <span id="enterMarketBtn">ورود به بازارچه</span>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
        </div>

        <a href="https://eitaa.com/enshejam_man" target="_blank" class="btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            مشاهده کانال
        </a>
    </div>

    <script>
        // 1. مقداردهی اولیه ایتا
        (function initEitaaApp() {
            if (window.Eitaa && window.Eitaa.WebApp) {
                const WebApp = window.Eitaa.WebApp;
                WebApp.ready();
                if (!WebApp.isExpanded) WebApp.expand();
            }
        })();

        // 2. دکمه ورود به بازارچه
        document.getElementById('enterMarketBtn').addEventListener('click', function() {
            window.location.href = 'market.html';
        });

        // ==========================================
        // 3. افکت متن تایپ شونده (Typewriter)
        // ==========================================
        const text = "اکوسیستمی گرم و صمیمی برای توانمندسازی اقتصادی و اطلاع‌رسانی محلی...";
        const typewriterElement = document.getElementById('typewriter');
        let i = 0;
        
        function typeWriter() {
            if (i < text.length) {
                typewriterElement.innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            } else {
                // وقتی تایپ تمام شد، نشانگر چشمک‌زن اضافه شود
                typewriterElement.innerHTML += '<span class="cursor"></span>';
            }
        }
        setTimeout(typeWriter, 500); // شروع با تاخیر

        // ==========================================
        // 4. افکت سه‌بعدی (3D Tilt) برای لوگو و کارت‌ها
        // ==========================================
        const tiltElements = document.querySelectorAll('#3dLogo, .3d-card');

        tiltElements.forEach(el => {
            el.addEventListener('mousemove', (e) => {
                const rect = el.getBoundingClientRect();
                const x = e.clientX - rect.left; // موقعیت موس نسبت به عنصر
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // محاسبه زاویه چرخش (هرچه از مرکز دورتر، چرخش بیشتر)
                const rotateX = ((y - centerY) / centerY) * -15; // حداکثر 15 درجه
                const rotateY = ((x - centerX) / centerX) * 15;

                el.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            // بازگشت به حالت عادی وقتی موس خارج شد یا انگشت برداشته شد
            el.addEventListener('mouseleave', () => {
                el.style.transform = `rotateX(0) rotateY(0)`;
            });
            el.addEventListener('touchend', () => {
                el.style.transform = `rotateX(0) rotateY(0)`;
            });
        });

        // ==========================================
        // 5. دکمه مغناطیسی (Magnetic Button)
        // ==========================================
        const magneticBtn = document.getElementById('magneticBtn');
        
        magneticBtn.addEventListener('mousemove', (e) => {
            const rect = magneticBtn.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // کشیده شدن دکمه به سمت موس (با ضریب 0.3)
            magneticBtn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
        });
        
        magneticBtn.addEventListener('mouseleave', () => {
            magneticBtn.style.transform = `translate(0px, 0px)`;
        });

        // ==========================================
        // 6. سیستم ذرات متحرک طلایی (Particles Canvas)
        // ==========================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        // تنظیم اندازه بوم
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // کلاس ذرات
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1; // اندازه بین 1 تا 4
                this.speedX = Math.random() * 1 - 0.5; // سرعت افقی
                this.speedY = Math.random() * -1 - 0.5; // حرکت به سمت بالا
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                // اگر از بالا خارج شد، از پایین دوباره وارد شود
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`; // رنگ طلایی
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // تولید ذرات
        function initParticles() {
            particlesArray = [];
            const numberOfParticles = (canvas.width * canvas.height) / 15000; // تعداد متناسب با صفحه
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        // حلقه انیمیشن
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
