<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>انسجام من</title>

    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    
    <link rel="stylesheet" href="https://cdn.fontcdn.ir/Font/Persian/YekanBakh/YekanBakh.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #041a17;
            --teal: #00bfa5;
            --teal-dark: #00796b;
            --gold: #e5c158;
            --orange: #ff7043;
            --pink: #ff80ab;
            --blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #8fa6a3;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Yekan Bakh', 'Vazirmatn', sans-serif;
            background-color: #000;
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100dvh;
            background-color: var(--bg-dark);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            overflow-x: hidden;
        }

        #particleCanvas {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* --- هدر --- */
        .header {
            position: relative;
            z-index: 1;
            padding: 20px 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-image {
            width: 100%;
            height: 130px;
            border-radius: 20px;
            background: url('assets/images/hero-bg.jpg') center/cover;
            position: relative;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-dark), transparent);
            border-radius: 20px;
        }

        .logo-badge {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            border: 3px solid var(--bg-dark);
            box-shadow: 0 6px 15px rgba(0, 191, 165, 0.3);
            z-index: 2;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            margin-top: 14px;
            background: linear-gradient(90deg, var(--gold), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.5;
        }

        /* --- محتوا (شبکه‌ای) --- */
        .content {
            position: relative;
            z-index: 1;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* دو ستونه */
            gap: 12px;
            flex-grow: 1;
            align-content: start;
        }

        .card-main, .card-secondary {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s;
        }

        /* کارت اصلی (تمام عرض) */
        .card-main {
            grid-column: 1 / -1; /* اشغال هر دو ستون */
            background: linear-gradient(135deg, rgba(0, 191, 165, 0.15), rgba(0, 191, 165, 0.05));
            border-color: rgba(0, 191, 165, 0.3);
            gap: 14px;
        }

        /* کارت‌های فرعی (نیم‌عرض) */
        .card-secondary {
            flex-direction: column;
            text-align: center;
            gap: 10px;
            padding: 20px 10px;
        }

        .card-main:active, .card-secondary:active {
            transform: scale(0.96);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-main .card-icon {
            background: var(--teal);
            box-shadow: 0 4px 12px rgba(0, 191, 165, 0.4);
        }

        .card-secondary .card-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
        }

        .card-text h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-main .card-text h3 { font-size: 17px; }

        .card-text p {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* رنگ‌های اختصاصی کارت‌ها */
        .icon-market { color: var(--teal); background: rgba(0, 191, 165, 0.1); }
        .icon-news { color: var(--gold); background: rgba(229, 193, 88, 0.1); }
        .icon-mosque { color: var(--blue); background: rgba(59, 130, 246, 0.1); }
        .icon-mothers { color: var(--pink); background: rgba(255, 128, 171, 0.1); }
        .icon-dashboard { color: var(--orange); background: rgba(255, 112, 67, 0.1); }

        /* --- دکمه پایین --- */
        .footer {
            position: relative;
            z-index: 1;
            padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
            margin-top: auto;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--teal), var(--teal-dark));
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 191, 165, 0.3);
            transition: transform 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        /* --- انیمیشن --- */
        .animate-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <canvas id="particleCanvas"></canvas>

        <div class="header animate-up">
            <div class="hero-image">
                <div class="hero-overlay"></div>
                <div class="logo-badge">ان</div>
            </div>
            <h1 class="title">انسجام من</h1>
            <p class="subtitle">اکوسیستمی مدرن برای توانمندسازی اقتصادی و اطلاع‌رسانی محلی</p>
        </div>

        <div class="content">
            <!-- ۱. بازارچه (تمام عرض) -->
            <a href="market.html" class="card-main animate-up delay-1">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                </div>
                <div class="card-text">
                    <h3>بازارچه محلی</h3>
                    <p>ورود به ویترین محصولات و خدمات بومی</p>
                </div>
            </a>

            <!-- ۲. کانال ایتا (نیم عرض) -->
            <a href="https://eitaa.com/ensejame_man" target="_blank" class="card-secondary animate-up delay-2">
                <div class="card-icon icon-news">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                    </svg>
                </div>
                <div class="card-text">
                    <h3 style="color: var(--gold);">کانال خبری</h3>
                    <p>آخرین اخبار محله</p>
                </div>
            </a>

            <!-- ۳. مساجد (نیم عرض) -->
            <a href="masjids.html" class="card-secondary animate-up delay-2">
                <div class="card-icon icon-mosque">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="card-text">
                    <h3 style="color: var(--blue);">مساجد محله</h3>
                    <p>آدرس و برنامه‌ها</p>
                </div>
            </a>

            <!-- ۴. گروه مادرانه (نیم عرض) -->
            <a href="mothers.html" class="card-secondary animate-up delay-3">
                <div class="card-icon icon-mothers">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </div>
                <div class="card-text">
                    <h3 style="color: var(--pink);">گروه مادرانه</h3>
                    <p>بخش ویژه بانوان</p>
                </div>
            </a>

            <!-- ۵. پنل فروشندگان (نیم عرض) -->
            <a href="dashboard.html" class="card-secondary animate-up delay-3">
                <div class="card-icon icon-dashboard">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <div class="card-text">
                    <h3 style="color: var(--orange);">پنل فروشندگان</h3>
                    <p>مدیریت غرفه و محصولات</p>
                </div>
            </a>
        </div>

        <div class="footer animate-up delay-4">
            <button class="btn-primary" id="enterMarketBtn">
                <span>ورود به بازارچه</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        (function initEitaaApp() {
            if (window.Eitaa && window.Eitaa.WebApp) {
                window.Eitaa.WebApp.ready();
                if (!window.Eitaa.WebApp.isExpanded) window.Eitaa.WebApp.expand();
            }
        })();

        document.getElementById('enterMarketBtn').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                window.location.href = 'market.html';
            }, 150);
        });

        // سیستم ذرات طلایی
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('app-container');
        let particles = [];

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedY = Math.random() * -0.5 - 0.1;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(229, 193, 88, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            const count = (canvas.width * canvas.height) / 15000;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();
        window.addEventListener('resize', init);
    </script>
</body>
</html>
