<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>انسجام من | بازارچه و کانال</title>

    <!-- کیت توسعه ایتا -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <!-- فونت وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f8fafc);
            --text: var(--tg-theme-text-color, #0f172a);
            --hint: var(--tg-theme-hint-color, #64748b);
            --button: var(--tg-theme-button-color, #10b981); /* سبز زمردی مدرن */
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.8);
            --viewport-height: var(--tg-viewport-stable-height, 100vh);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #f8fafc;
                --hint: #94a3b8;
                --glass-bg: rgba(30, 41, 59, 0.6);
                --glass-border: rgba(255, 255, 255, 0.1);
                --card-bg: #1e293b;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: var(--viewport-height);
            display: flex;
            flex-direction: column;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- نورپردازی پس‌زمینه (Mesh Gradient) --- */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: pulse 8s infinite alternate;
        }
        .glow-1 { top: -10%; right: -10%; width: 60vw; height: 60vw; background: #10b981; }
        .glow-2 { bottom: 10%; left: -20%; width: 50vw; height: 50vw; background: #3b82f6; animation-delay: -4s; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.1); opacity: 0.7; }
        }

        /* --- بخش هدر و لوگو --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 4vh;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        .logo-main {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #059669, #10b981);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 800;
            color: white;
            box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.5);
            position: relative;
            z-index: 2;
        }

        .logo-glow {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #059669, #10b981);
            border-radius: 30px;
            filter: blur(20px);
            opacity: 0.6;
            z-index: 1;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--hint);
            font-weight: 400;
            max-width: 280px;
            line-height: 1.6;
        }

        /* --- کارت‌های ویژگی (شیشه‌ای) --- */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 40px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        .feature-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px 16px;
            text-align: right;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s;
        }

        .feature-card:active { transform: scale(0.97); }

        .feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .feature-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .feature-desc {
            font-size: 12px;
            color: var(--hint);
            line-height: 1.5;
        }

        /* --- بخش دکمه‌ها --- */
        .actions {
            margin-top: auto;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.4);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 5px 15px -5px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:active::before { left: 100%; }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: var(--text);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-secondary:active { background: var(--card-bg); }

        /* --- انیمیشن‌ها --- */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- نورهای پس‌زمینه -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- هدر -->
    <div class="header">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <div class="logo-main">ان</div>
        </div>
        <h1 class="title">انسجام من</h1>
        <p class="subtitle">اکوسیستمی مدرن برای توانمندسازی اقتصادی و اطلاع‌رسانی محلی</p>
    </div>

    <!-- کارت‌های ویژگی -->
    <div class="features">
        <div class="feature-card">
            <div class="feature-icon">🛒</div>
            <div class="feature-title">بازارچه محلی</div>
            <div class="feature-desc">معرفی و دسترسی به محصولات و خدمات بومی</div>
        </div>
        <div class="feature-card">
            <div class="feature-icon">📢</div>
            <div class="feature-title">اخبار و رویدادها</div>
            <div class="feature-desc">اطلاع از آخرین فرصت‌ها در کانال انسجام</div>
        </div>
    </div>

    <!-- دکمه‌ها -->
    <div class="actions">
        <button class="btn-primary" id="enterMarketBtn">
            ورود به بازارچه
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>

        <a href="https://eitaa.com/enshejam_man" target="_blank" class="btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            مشاهده کانال
        </a>
    </div>

    <script>
        (function initEitaaApp() {
            if (window.Eitaa && window.Eitaa.WebApp) {
                const WebApp = window.Eitaa.WebApp;
                WebApp.ready();
                if (!WebApp.isExpanded) WebApp.expand();
            }
        })();

        document.getElementById('enterMarketBtn').addEventListener('click', function() {
            const marketUrl = 'market.html';
            window.location.href = marketUrl;
        });
    </script>
</body>
</html>
