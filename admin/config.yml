backend:
  name: github
  repo: enserjam/ensejam.github.io # نام کاربری و مخزن خود را وارد کنید
  branch: main # یا master

media_folder: "images/uploads" # مسیر ذخیره عکس‌ها
public_folder: "/images/uploads"

collections:
  - name: "products" # نام مجموعه
    label: "محصولات" # برچسب در منو
    folder: "data/products" # پوشه ذخیره فایل‌های JSON
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "نام محصول", name: "title", widget: "string"}
      - {label: "قیمت", name: "price", widget: "number"}
      - {label: "دسته‌بندی", name: "category", widget: "select", options: ["خوراکی", "صنایع دستی", "پوشاک", "دیجیتال"]}
      - {label: "توضیحات", name: "description", widget: "text"}
      - {label: "تصویر محصول", name: "image", widget: "image", required: false}
